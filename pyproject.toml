# build-backend = "uv_build"

[project.optional-dependencies]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[dependency-groups]
dev = [
    "flexsweep[docs]",
    "maturin>=1.13.1",
    "ziglang>=0.15.2",
]
